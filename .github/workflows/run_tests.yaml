name: Run Kafka Pipeline

permissions:
  contents: read
  packages: read
  actions: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

jobs:

  Wait-for-images:
    runs-on: ubuntu-latest
    outputs:
      skip_tests: ${{ steps.check.outputs.skip_tests }}
    steps:
      - name: Check if dev_build.yml was triggered for this commit
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            SHA="${{ github.event.pull_request.head.sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          RUNS=$(gh run list --workflow dev_build.yml --repo ${{ github.repository }} --commit $SHA)
          SKIP_TESTS="false"
          if [ -z "$RUNS" ]; then
            SKIP_TESTS="true"
          fi
          echo SKIP_TESTS: $SKIP_TESTS
          echo "skip_tests=$SKIP_TESTS" >> $GITHUB_OUTPUT
      - name: Wait for push.yml to complete
        if: steps.check.outputs.skip_tests == 'false'
        uses: netcracker/qubership-workflow-hub/actions/wait-for-workflow@8b1f50086b028c0ad22dafd33352e2166189b742  # v2.7.0
        id: wait
        with:
          workflow: dev_build.yml
          token: ${{ secrets.GITHUB_TOKEN }}
          poll-interval: 20

  Kafka-Pipeline:
    needs: Wait-for-images
    uses: Netcracker/qubership-test-pipelines/.github/workflows/kafka.yaml@e1905f040398e9ae733b0cefa7e7793b6204ecfe # v1.16.0
    with:
      repository_name: ${{ github.repository }}
      service_branch: '${{ github.head_ref || github.ref_name }}'
      pipeline_branch: 'e1905f040398e9ae733b0cefa7e7793b6204ecfe' # v1.16.0 renovate: depName=Netcracker/qubership-test-pipelines
      skip_tests: ${{ fromJSON(needs.Wait-for-images.outputs.skip_tests) }}
    secrets:
      AWS_S3_ACCESS_KEY_ID: ${{secrets.AWS_S3_ACCESS_KEY_ID}}
      AWS_S3_ACCESS_KEY_SECRET: ${{secrets.AWS_S3_ACCESS_KEY_SECRET}}
