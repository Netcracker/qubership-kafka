# Default values for charts.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  name: kafka

  waitForPodsReady: true
  podReadinessTimeout: 600

  monitoringType: "prometheus"
  installDashboard: true

  restrictedEnvironment: false
#  smDbHost: "http://monitoring.com:8086"
#  smDbName: "cloud_openshift_com"
  ipv6: false

  tls:
    enabled: false
    cipherSuites: []
    allowNonencryptedAccess: true
    generateCerts:
      enabled: true
      certProvider: cert-manager
      durationDays: 365
      clusterIssuerName: ""

  externalKafka:
    enabled: false
    bootstrapServers: ""
    replicas: ""
    saslMechanism: ""
    enableSsl: false
    sslSecretName: ""
    username: ""
    password: ""

  velero:
    preHookBackupEnabled: true
    postHookRestoreEnabled: true

  customLabels: {}
  securityContext: {}

  disasterRecovery:
    siteManagerApiGroup: "netcracker.com"
    image: ghcr.io/netcracker/qubership-disaster-recovery-daemon:main@sha256:fdddd5b119a86a9f0dc21b213051b8d5f88901f785dbc02babe6a25f14c7c48b
    tls:
      enabled: true
      certificates:
        crt: ""
        key: ""
        ca: ""
      secretName: ""
      cipherSuites: []
      subjectAlternativeName:
        additionalDnsNames: []
        additionalIpAddresses: []
    httpAuth:
      enabled: false
      smSecureAuth: false
      smNamespace: "site-manager"
      smServiceAccountName: ""
      restrictedEnvironment: false
      customAudience: "sm-services"
    mode: ""
    region: ""
    siteManagerEnabled: true
    afterServices: []
    serviceExport:
      enabled: false
    mirrorMakerReplication:
      enabled: false
    topicsBackup:
      enabled: false
    resources:
      limits:
        cpu: "32m"
        memory: "32Mi"
      requests:
        cpu: "10m"
        memory: "10Mi"
    customLabels: {}

  secrets:
    kafka:
      disableSecurity: false
      adminUsername: ""
      adminPassword: ""
      clientUsername: ""
      clientPassword: ""
    monitoring:
      prometheusUsername: ""
      prometheusPassword: ""
      smDbUsername: ""
      smDbPassword: ""
    akhq:
      defaultUsername: ""
      defaultPassword: ""
      schemaRegistryUsername: ""
      schemaRegistryPassword: ""
    backupDaemon:
      username: ""
      password: ""
      s3:
        keyId: ""
        keySecret: ""
    cruiseControl:
      adminUsername: ""
      adminPassword: ""
      viewerUsername: ""
      viewerPassword: ""
    integrationTests:
      zabbix:
        username: ""
        password: ""
      idp:
        username: ""
        password: ""
        registrationToken: ""
      prometheus:
        user: ""
        password: ""

