{{- if .Values.mirrorMakerMonitoring.install }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "kafka.name" . }}-mirror-maker-monitoring-secret
  labels:
    {{- include "kafka-services.defaultLabels" . | nindent 4 }}
  annotations:
    kafkaservice.netcracker.com/auto-restart: {{ .Values.kafka.autoRestartOnSecretChange | quote }}
type: Opaque
{{- end }}
