version: '2'
services:
  zookeeper:
    image: ghcr.io/netcracker/qubership-docker-zookeeper:main@sha256:98110b168624ce14678d3ac165440180be9dd50f43baed3c655e2ae40cb70a22
    ports:
      - 2181:2181
  kafka:
    image: ghcr.io/netcracker/qubership-docker-kafka:main@sha256:fe0fb45dacfb42d6165cd50c811f57c18eb791fd44404a5b9c98a4ff1c3f1271
    ports:
      - 9094:9094
    links:
      - zookeeper
    depends_on:
      - zookeeper
    environment:
      - BROKER_ID=1
      - REPLICATION_FACTOR=3
      - ZOOKEEPER_CONNECT=zookeeper:2181
      - DISABLE_SECURITY=true
      - READINESS_PERIOD=30
      - EXTERNAL_HOST_NAME=localhost
      - EXTERNAL_PORT=9094
      - CONF_KAFKA_MIN_INSYNC_REPLICAS=1
  akhq:
    image: ghcr.io/netcracker/qubership-docker-akhq:main@sha256:f4d9bdcc79e6cb8cf1419ca69fcd90a00162e4b3f688a617ae083ac7616bdccf
    ports:
      - 8080:8080
    links:
      - kafka
    depends_on:
      - kafka
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            kafka:
              properties:
                bootstrap.servers: "kafka:9092"
                security.protocol: PLAINTEXT